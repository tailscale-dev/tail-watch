[tools]
go = "1.27.1"
bun = "1.4.2"
"npm:@fission-ai/openspec" = "1.13.2"

[settings]
npm.package_manager = "bun"

[tasks.build]
description = "Build the tsmon binary"
run = "go build -o bin/tsmon ./cmd/tsmon"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.check]
description = "Build, test, and lint"
depends = ["build", "test", "lint"]
