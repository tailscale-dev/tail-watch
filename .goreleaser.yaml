version: 2
project_name: tail-watch

builds:
  - id: tail-watch
    main: ./cmd/tail-watch
    binary: tail-watch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - examples/tail-watch.yaml

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  # Release Please owns the release notes.
  mode: keep-existing
