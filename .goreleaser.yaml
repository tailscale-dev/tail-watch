version: 2
project_name: tsmon

builds:
  - id: tsmon
    main: ./cmd/tsmon
    binary: tsmon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - examples/tsmon.yaml

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  # Release Please owns the release notes.
  mode: keep-existing
