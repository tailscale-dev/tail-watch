version: 2
project_name: tail-watch

builds:
  - id: tail-watch
    main: ./cmd/tail-watch
    binary: tail-watch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/**/*
      - examples/tail-watch.yaml
      - examples/tail-watch.service

dockers_v2:
  - id: tail-watch
    ids: [tail-watch]
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/tailscale-dev/tail-watch
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Tailnet reachability monitor
      org.opencontainers.image.source: https://github.com/tailscale-dev/tail-watch
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: BSD-3-Clause
    sbom: false

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  # Release Please owns the release notes.
  mode: keep-existing
