# Merged over examples/compose.yaml by TestLiveTailnetDocker when no device
# on the tailnet has an enabled subnet route. The router advertises
# 10.10.50.0/24 and answers 10.10.50.1 from its loopback.
services:
  router:
    image: tailscale/tailscale:v1.102.5
    hostname: ${TS_ROUTER_HOSTNAME:?}
    entrypoint:
      - sh
      - -c
      - ip addr replace 10.10.50.1/32 dev lo && exec /usr/local/bin/containerboot
    environment:
      TS_AUTHKEY: ${TS_ROUTER_AUTHKEY:?}
      TS_HOSTNAME: ${TS_ROUTER_HOSTNAME:?}
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_ROUTES: 10.10.50.0/24
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv4.conf.lo.rp_filter: "0"
