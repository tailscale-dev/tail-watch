# The workload the ProxyGroup forwards to, and the in-cluster receiver the
# sidecar's webhook sink posts to. Nothing here joins the tailnet.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
# The ClusterIP Service the sidecar probes. The injected tail-watch config in
# examples/kubernetes/configmap.yaml targets web.apps.svc.cluster.local:80.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: apps
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# The L4 Service the operator advertises as Tailscale Service svc:tw-pg-web
# through ProxyGroup ingress.
apiVersion: v1
kind: Service
metadata:
  name: web-ts
  namespace: apps
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: tw-pg-web
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# alert-receiver stores every POST body and returns them all on GET /events,
# one per line, so the test can assert target.down and target.recovered
# without any external sink.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver
  namespace: apps
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer

    bodies = []

    class H(BaseHTTPRequestHandler):
        def do_POST(self):
            n = int(self.headers.get("Content-Length") or 0)
            bodies.append(self.rfile.read(n).decode())
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_GET(self):
            if self.path == "/events":
                body = "\n".join(bodies).encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: receiver
          image: python:3.13-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: alert-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: apps
spec:
  selector:
    app: alert-receiver
  ports:
    - port: 8080
      targetPort: 8080
