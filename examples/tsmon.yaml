# Example tsmon config.
# network: tailnet (the default) means IP checks should follow Tailscale,
# including subnet routes the host has accepted.
# network: local means the host's ordinary route, such as a LAN the
# collector is plugged into. Local targets do not use tsping.

collector:
  listen: 127.0.0.1:9109
  state_dir: /var/lib/tsmon

defaults:
  interval: 30s
  timeout: 5s
  fail_threshold: 3
  recover_threshold: 2
  flap_limit: 4
  flap_window: 15m

targets:
  - name: nyc-subnet-router
    addr: nyc-router
    site: nyc
    network: tailnet
    checks: [tsping]
    interval: 15s

  - name: nyc-core-switch
    addr: 10.20.0.1
    site: nyc
    network: tailnet
    parent: nyc-subnet-router
    checks: [icmp]

  - name: nyc-nas
    addr: 10.20.0.50
    site: nyc
    network: tailnet
    parent: nyc-subnet-router
    checks:
      - icmp
      - tcp:445
      - "http:https://10.20.0.50:5001/|DSM"

  - name: nyc-printer
    addr: 10.20.0.80
    site: nyc
    network: tailnet
    severity: warn
    parent: nyc-subnet-router
    checks: [icmp]

  - name: lab-printer
    addr: 192.168.1.50
    site: lab
    network: local
    severity: warn
    checks:
      - icmp
      - tcp:9100
      - "http:http://192.168.1.50/|ready"
