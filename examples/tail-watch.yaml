# Example tail-watch config.
# network: tailnet (the default) means IP checks should follow Tailscale,
# including subnet routes the host has accepted.
# network: local means the host's ordinary route, such as a LAN the
# collector is plugged into. Local targets do not use tsping.

collector:
  listen: 127.0.0.1:9109
  state_dir: /var/lib/tail-watch
  # ui: true serves the monitor UI at /ui/ (or run with --ui). It needs state_dir.
  # ui: true
  # setec reads *_setec secrets from a tailnet setec server. It is commented
  # out because startup contacts the server, and this file must still start
  # with only the *_env variables set. See docs/how-to/setec-secrets.md.
  # setec:
  #   server: https://secrets.example.ts.net
  #   poll_interval: 5m

defaults:
  interval: 30s
  timeout: 5s
  fail_threshold: 3
  recover_threshold: 2
  flap_limit: 4
  flap_window: 15m

targets:
  - name: nyc-subnet-router
    addr: nyc-router
    site: nyc
    network: tailnet
    checks: [tsping]
    interval: 15s

  - name: nyc-core-switch
    addr: 10.20.0.1
    site: nyc
    network: tailnet
    parent: nyc-subnet-router
    checks: [icmp]

  - name: nyc-nas
    addr: 10.20.0.50
    site: nyc
    network: tailnet
    parent: nyc-subnet-router
    checks:
      - icmp
      - tcp:445
      - "http:https://10.20.0.50:5001/|DSM"

  - name: nyc-printer
    addr: 10.20.0.80
    site: nyc
    network: tailnet
    severity: warn
    parent: nyc-subnet-router
    checks: [icmp]

  - name: lab-printer
    addr: 192.168.1.50
    site: lab
    network: local
    severity: warn
    checks:
      - icmp
      - tcp:9100
      - "http:http://192.168.1.50/|ready"

# Notifications. Secrets come from *_env, *_file, or *_setec keys.
# Try them with: tail-watch notify-test --config examples/tail-watch.yaml
# A commented ops-setec sink is below. Uncomment it, and collector.setec
# above, only when that server is reachable. check-config does not contact it.
sinks:
  - name: ops-webhook
    type: webhook
    url_env: OPS_WEBHOOK_URL
    secret_env: OPS_WEBHOOK_SECRET # HMAC key for Tail-Watch-Signature
    min_severity: page
    events: [target.down, target.recovered]
    queue: disk # survives restarts; needs collector.state_dir

  - name: ops-slack
    type: slack
    url_env: SLACK_WEBHOOK_URL
    min_severity: warn
    mention_on_page: "<!subteam^S0123ABC>"
    group_wait: 10s
    status_url: https://monitor-nyc.example.ts.net:9109
    match:
      sites: [nyc, lab]

  - name: ops-teams
    type: teams
    url_env: TEAMS_WEBHOOK_URL # Workflows "When a Teams webhook request is received" URL
    min_severity: warn
    group_wait: 10s
    status_url: https://monitor-nyc.example.ts.net:9109
    match:
      sites: [nyc, lab]

  # - name: ops-setec
  #   type: webhook
  #   url_setec: prod/tail-watch/webhook-url
  #   secret_setec: prod/tail-watch/webhook-hmac
  #   min_severity: page
  #   events: [target.down, target.recovered]

# Pings a dead-man's-switch service so a dead collector still alerts.
heartbeat:
  url_env: HEARTBEAT_URL
  interval: 1m
