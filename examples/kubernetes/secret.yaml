# PLACEHOLDER VALUES ONLY. Replace them before relying on alerts.
# Sink secrets for the tail-watch sidecar of ProxyGroup "ingress". The
# container reads them through envFrom; the *_env keys in the ConfigMap name
# these variables. check-config does not resolve them, but the collector
# refuses to start when they are unset or empty. The envFrom reference is
# optional, so a missing Secret never blocks the pod.
apiVersion: v1
kind: Secret
metadata:
  name: tail-watch-ingress
  namespace: tailscale
type: Opaque
stringData:
  OPS_WEBHOOK_URL: "https://example.invalid/REPLACE-ME"
  OPS_WEBHOOK_SECRET: "REPLACE-ME"
